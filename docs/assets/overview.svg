<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">Operating systems lab overview</title>
  <description id="description">Four projects progress from POSIX processes and threads to xv6 scheduling and virtual memory.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1120" height="350" rx="20" fill="url(#background)"/>
  <text x="56" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">From user space to the kernel</text>
  <text x="56" y="94" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Four focused labs, two pinned xv6 patch sets, one reproducible systems portfolio</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="142" width="220" height="142" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="76" y="178" fill="#7dd3fc" font-size="14" font-weight="700">POSIX FOUNDATIONS</text>
    <text x="76" y="213" fill="#f8fafc" font-size="20" font-weight="700">Processes &amp; Signals</text>
    <text x="76" y="242" fill="#cbd5e1" font-size="15">fork · exec · waitpid</text>
    <text x="76" y="266" fill="#cbd5e1" font-size="15">SIGCHLD · status decoding</text>

    <rect x="318" y="142" width="220" height="142" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="340" y="178" fill="#6ee7b7" font-size="14" font-weight="700">CONCURRENCY</text>
    <text x="340" y="213" fill="#f8fafc" font-size="20" font-weight="700">Pthreads Game</text>
    <text x="340" y="242" fill="#cbd5e1" font-size="15">workers · mutex · atomics</text>
    <text x="340" y="266" fill="#cbd5e1" font-size="15">terminal lifecycle</text>

    <rect x="582" y="142" width="220" height="142" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="604" y="178" fill="#c4b5fd" font-size="14" font-weight="700">KERNEL SCHEDULING</text>
    <text x="604" y="213" fill="#f8fafc" font-size="20" font-weight="700">xv6 MLFQ</text>
    <text x="604" y="242" fill="#cbd5e1" font-size="15">priority · time slices</text>
    <text x="604" y="266" fill="#cbd5e1" font-size="15">round robin · starvation</text>

    <rect x="846" y="142" width="220" height="142" rx="14" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="868" y="178" fill="#fda4af" font-size="14" font-weight="700">VIRTUAL MEMORY</text>
    <text x="868" y="213" fill="#f8fafc" font-size="20" font-weight="700">xv6 mmap</text>
    <text x="868" y="242" fill="#cbd5e1" font-size="15">VMA · lazy faults · PTE</text>
    <text x="868" y="266" fill="#cbd5e1" font-size="15">shared write-back · fork</text>
  </g>

  <path d="M278 213 H308" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M542 213 H572" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M806 213 H836" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="56" y="321" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Static overview · no interactive diagram controls</text>
</svg>

