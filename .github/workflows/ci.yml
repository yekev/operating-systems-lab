name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  user-space:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test process lab
        run: make -C labs/01-processes-and-signals smoke-test
      - name: Build Pthreads game
        run: make -C labs/02-pthreads-terminal-game

  xv6-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lab: [mlfq, mmap]
    steps:
      - uses: actions/checkout@v7
      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils-riscv64-linux-gnu \
            expect \
            gcc-riscv64-linux-gnu \
            qemu-system-misc
      - name: Prepare patched xv6 tree
        run: ./scripts/prepare-xv6.sh "${{ matrix.lab }}"
      - name: Build xv6
        run: make -C "build/xv6-${{ matrix.lab }}"
      - name: Run MLFQ smoke test in QEMU
        if: matrix.lab == 'mlfq'
        run: ./scripts/run-mlfq-smoke.exp build/xv6-mlfq
      - name: Run upstream mmap tests in QEMU
        if: matrix.lab == 'mmap'
        working-directory: build/xv6-mmap
        run: ./grade-lab-mmap -v mmaptest
